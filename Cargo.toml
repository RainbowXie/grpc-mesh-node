[package]
name = "grpc-mesh"
version = "0.1.1"
edition = "2024"

[workspace]
members = ["crates/grpc-mesh-node-ffi"]
resolver = "2"

[dependencies]
flate2 = "1.1.5"
futures = "0.3"
lazy_static = "1.5"
log = { version = "0.4" }
hostname = "0.4.2"
prost = "0.14.1"
uuid = { version = "1.19", features = ["v4", "fast-rng"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "io-util",
    "sync",
    "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
tokio-stream = "0.1.17"
tokio-util = { version = "0.7.17", features = ["compat"] }
tonic = { version = "0.14.2", features = ["transport"] }
tonic-prost = "0.14.2"
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
webpki-roots = "1.0.4"
yamux = { version = "0.13.8", default-features = false }

[build-dependencies]
protoc-bin-vendored = "3.2"
tonic-prost-build = "0.14.2"

[dev-dependencies]
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.13"
tower = "0.5"

